[workspace]
members = [
    "crates/meldritch-interface",
    "crates/meldritch-arp",
    "crates/meldritch-midi-utils",
    "crates/meldritch2",
    "crates/meldritch-vst3-fixture",
]
default-members = ["crates/meldritch2"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97"

[workspace.dependencies]
arc-swap = "1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
cpal = "0.18"
crossterm = "0.29"
elgato-streamdeck = "0.14"
font8x8 = "0.3"
hound = "3"
claxon = "0.4"
lewton = "0.10"
image = { version = "0.25", default-features = false }
meldritch-interface = { path = "crates/meldritch-interface" }
meldritch-arp = { path = "crates/meldritch-arp" }
meldritch-midi-utils = { path = "crates/meldritch-midi-utils" }
midir = "0.11"
percent-encoding = "2"
ratatui = "0.30"
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
toml = "1"
url = "2"
ureq = "3"
vst3-host = { version = "0.11", path = "crates/meldritch2/vendor/vst3-host", default-features = false }
