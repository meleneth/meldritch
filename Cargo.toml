[workspace]
members = [
    "crates/meldritch-app",
    "crates/meldritch-audio",
    "crates/meldritch-cli",
    "crates/meldritch-core",
    "crates/meldritch-control",
    "crates/meldritch-dsl",
    "crates/meldritch-render",
    "crates/meldritch-tui",
    "crates/meldritch2",
]
default-members = ["crates/meldritch2"]
resolver = "2"

[package]
name = "meldritch"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "meldritch"
path = "crates/meldritch-cli/src/main.rs"

[dependencies]
clap.workspace = true
meldritch-app = { path = "crates/meldritch-app" }
meldritch-audio = { path = "crates/meldritch-audio" }
meldritch-core = { path = "crates/meldritch-core" }
meldritch-control = { path = "crates/meldritch-control" }
meldritch-dsl = { path = "crates/meldritch-dsl" }
meldritch-render = { path = "crates/meldritch-render" }
meldritch-tui = { path = "crates/meldritch-tui" }
midir.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
crossterm.workspace = true

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97"

[workspace.dependencies]
arc-swap = "1"
clap = { version = "4", features = ["derive"] }
cpal = "0.18"
crossterm = "0.29"
elgato-streamdeck = "0.14"
font8x8 = "0.3"
hound = "3"
image = { version = "0.25", default-features = false }
midir = "0.11"
percent-encoding = "2"
ratatui = "0.30"
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1"
ureq = "3"
